name: CD

on:
  release:
    types: [published]

jobs:
  publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write # 允许为本作业签发 GitHub OIDC 令牌(可信发布所需)

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Lunarium.Common/Lunarium.Common.csproj --configuration Release --no-build --output ./nupkgs

      # OIDC → 临时 API key(有效期 1 小时, 故紧贴推送前获取)
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
