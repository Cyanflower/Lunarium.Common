name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '*.slnx'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '*.slnx'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # 库自带 IsAotCompatible，构建时 IL2026/IL3050 分析器即为开启状态，
      # 因此这一步同时充当 AOT/裁剪兼容性的回归防线。
      - name: Test
        run: dotnet test --configuration Release --no-build

      # 示例项目已加入解决方案; 这一步验证文档示例不仅能编译, 也能实际运行
      - name: Run examples
        run: dotnet run --project docs/examples/Lunarium.Common.Examples.csproj --configuration Release --no-build -- all

      # 把打包也纳入 CI：否则包元数据/README 打包要到发版时才第一次被验证
      - name: Pack (verify packaging)
        run: dotnet pack src/Lunarium.Common/Lunarium.Common.csproj --configuration Release --no-build --output ./nupkgs
